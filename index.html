<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>MageNoir</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
		  <div class="text" id="unity-progress-loading-text">Chargement: <span id="loading">0%</span></div>
        </div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loading = document.querySelector("#loading");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "5336a4b2c43054286fd70b1faa467eee.loader.js";
      var config = {
          cacheControl: function (url) {
            // Caching enabled for .data and .bundle files.
            // Revalidate if file is up to date before loading from cache
            if (url.match(/\.data/) || url.match(/\.bundle/) || url.match(/\.unityweb/)) {
              return "must-revalidate";
            }
            
            // Disable explicit caching for all other files.
            // Note: the default browser cache may cache them anyway.
            return "no-store";
          },
          dataUrl: buildUrl + "29c8aa10f8969ac3de031b57d9b05999.data.unityweb",
          frameworkUrl: buildUrl + "8b2d9b93e7ece93c829afabd4f2edff4.framework.js.unityweb",
          codeUrl: buildUrl + "b97b514dd41edbfa554bc14d82b2352e.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "MageNoir",
          productVersion: "0.1.3",
          autoSyncPersistentDataPath: true
        };

      var isMobile = false;
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl");
      var gl2 = c.getContext("webgl2");
      
      if ((gl && gl.getExtension('WEBGL_compressed_texture_astc')) || (gl2 &&
          gl2.getExtension('WEBGL_compressed_texture_astc'))) {
          isMobile = true;
      }

      if(isMobile) {
        container.className = "unity-mobile";
        if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          canvas.style.height = Math.round(window.innerHeight * 0.9) + "px";
          canvas.style.marginTop = Math.round(window.innerHeight * 0.1) + "px";
        } else {
          canvas.style.height = window.innerHeight + "px";
        }
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        document.body.style.overflow = "hidden";
      }
      
      canvas.style.background = "url('" + buildUrl + "/') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
		  loading.textContent = Math.round(progress * 100) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          hardReload();
        });
      };
      
      document.body.appendChild(script);

      if(isMobile) {
        window.addEventListener("resize", () => {
          if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            canvas.style.height = Math.round(window.innerHeight * 0.9) + "px";
            canvas.style.marginTop = Math.round(window.innerHeight * 0.1) + "px";
          } else {
            canvas.style.height = window.innerHeight + "px";
          }
        });
      }
      
      function hardReload() {
        var reloadChoice = window.confirm("Une erreur est survenue, essayer en rechargeant la page ?\n" +
          "Si l'erreur persiste, merci d'essayer de recharger manuellement en supprimant les données de navigation utilisées par ce site.");
        if(reloadChoice === true) {
          //https://stackoverflow.com/questions/2099201/javascript-hard-refresh-of-current-page
          async function handleHardReload(url) {
            await fetch(url, {
              headers: {
                  Pragma: 'no-cache',
                  Expires: '-1',
                  'Cache-Control': 'no-cache',
              },
            });
            window.location.href = url;
            // This is to ensure reload with url's having '#'
            window.location.reload();
          }

          handleHardReload(window.location.href);
        }
      }
    </script>
  </body>
</html>
